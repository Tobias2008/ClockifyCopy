quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.max-size=10
quarkus.flyway.migrate-at-start=${DB_MIGRATE:true}
quarkus.flyway.clean-disabled=true
quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=32K
quarkus.http.access-log.enabled=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.mailer.mock=false
quarkus.mailer.from=${SMTP_FROM:}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=REQUIRED
ballzeit.public-url=${PUBLIC_URL:http://localhost:8080}
ballzeit.cookie-secure=true
ballzeit.bootstrap-key=${BOOTSTRAP_KEY:}
ballzeit.mail-enabled=${MAIL_ENABLED:false}
%dev.ballzeit.cookie-secure=false
%dev.quarkus.mailer.mock=true
%dev.ballzeit.mail-enabled=true
%test.ballzeit.cookie-secure=false
%test.quarkus.mailer.mock=true
%test.ballzeit.mail-enabled=true

%dev.quarkus.mailer.from=ballzeit@localhost
%test.quarkus.mailer.from=ballzeit@localhost
quarkus.mailer.timeout=10S
quarkus.mailer.tls=false
%test.ballzeit.bootstrap-key=only-for-isolated-tests-not-a-production-secret-2026
