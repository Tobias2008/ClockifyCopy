# Domain und Zertifikatpfade vor Verwendung ersetzen.
server {
    listen 80;
    server_name ballzeit.eure-schule.at;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ballzeit.eure-schule.at;
    ssl_certificate /etc/letsencrypt/live/ballzeit.eure-schule.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ballzeit.eure-schule.at/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;
    location /q/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
